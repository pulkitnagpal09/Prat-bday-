<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Happy Birthday Pratishtha ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Great+Vibes&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins;
}

body{

background:linear-gradient(135deg,#ff5ea7,#ffd6ec);
color:white;
overflow-x:hidden;

}

section{

min-height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
padding:40px;

}

h1{

font-family:"Great Vibes";
font-size:80px;

}

h2{

font-size:40px;
margin-bottom:20px;

}

p{

max-width:800px;
text-align:center;
font-size:20px;
line-height:1.8;

}

#countdown{

font-size:40px;
font-weight:bold;
margin-top:20px;

}

.gallery{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
width:90%;
margin-top:40px;

}

.gallery img{

width:100%;
border-radius:20px;
box-shadow:0 15px 35px rgba(0,0,0,.3);

}

.card{

width:280px;
height:180px;
background:white;
color:#ff2c7d;
border-radius:20px;
display:flex;
justify-content:center;
align-items:center;
font-size:22px;
font-weight:bold;
transition:.6s;
transform-style:preserve-3d;
cursor:pointer;

}

.card:hover{

transform:rotateY(180deg);

}

button{

padding:18px 50px;
font-size:24px;
border:none;
border-radius:50px;
background:white;
color:#ff2c7d;
cursor:pointer;
margin-top:30px;

}

audio{

margin-top:20px;

}

</style>

</head>

<body>

<section>

<h1>Happy Birthday</h1>

<h2>Pratishtha ❤️</h2>

<h3>25 August 2026</h3>

<div id="countdown"></div>

</section>

<section>

<h2>A Letter For You</h2>

<p id="typing"></p>

</section>

<section>

<h2>Our Memories</h2>

<div class="gallery">

<img src="images/1.jpg">
<img src="images/2.jpg">
<img src="images/3.jpg">
<img src="images/4.jpg">

</div>

</section>

<section>

<h2>Reasons You're Amazing</h2>

<div class="gallery">

<div class="card">Your Smile 😊</div>

<div class="card">Your Kindness ❤️</div>

<div class="card">Your Laugh 😂</div>

<div class="card">Just You 💖</div>

</div>

</section>

<section>

<h2>Our Song</h2>

<audio controls autoplay loop>

<source src="music.mp3">

</audio>

<button onclick="party()">One Last Surprise 🎁</button>

</section>

<script>

const birthday=new Date("Aug 25 2026 00:00:00").getTime();

setInterval(()=>{

const now=new Date().getTime();

const distance=birthday-now;

if(distance<0){

document.getElementById("countdown").innerHTML="🎉 Happy 18th Birthday! 🎉";

return;

}

let d=Math.floor(distance/(1000*60*60*24));

let h=Math.floor((distance%(1000*60*60*24))/(1000*60*60));

let m=Math.floor((distance%(1000*60*60))/(1000*60));

let s=Math.floor((distance%(1000*60))/1000);

document.getElementById("countdown").innerHTML=d+" Days "+h+" Hours "+m+" Minutes "+s+" Seconds";

},1000);

const text=`hi Pratishtha,

So your birthday is coming and that too 18th

here you go for your birthday month 

see idk this might tell you i totally remembered 

and yes you ofc dont hate me 

cute you are funny with that

so this would be the countdown to the wishes and the gifts that i am still in figuring phase

so a countdown to it 
with just reminders of how we don't hate 
like you too😛❤️`;

let i=0;

function type(){

if(i<text.length){

document.getElementById("typing").innerHTML+=text.charAt(i);

i++;

setTimeout(type,45);

}

}

type();

function party(){

confetti({

particleCount:300,

spread:180,

origin:{y:.6}

});

}

</script>

</body>

</html>
